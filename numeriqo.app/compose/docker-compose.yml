version: '3.9'

services:
  numeriqo-app:
    build:
      context: ../..
      dockerfile: numeriqo.app/Dockerfile
    container_name: numeriqo-app
    extra_hosts:
      - "postgres:10.10.0.3"
    env_file:
      - ../../.suite.general.env
      - ../.numeriqo.env
    environment:
      NODE_ENV: ${NUMQ_APP_NODE_ENV:-production}
      PORT: ${NUMQ_APP_PORT:-6750}
      OTEL_EXPORTER_OTLP_ENDPOINT: "${SUITE_OBS_OTEL_COLLECTOR_HTTP_URL:-http://otel-collector:4318}/v1/traces"
      OTEL_SERVICE_NAME: numeriqo.app
    networks:
      - traefik_default
      - observability
      - backing
      - data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${NUMQ_APP_PORT:-6750}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_default
      - traefik.http.routers.numeriqo-app.rule=Host(`numeriqo.geniuserp.app`)
      - traefik.http.routers.numeriqo-app.entrypoints=websecure
      - traefik.http.routers.numeriqo-app.tls.certresolver=cloudflare
      - traefik.http.routers.numeriqo-app.middlewares=security-headers@file
      - traefik.http.services.numeriqo-app.loadbalancer.server.port=6750
    restart: unless-stopped


networks:
  traefik_default:
    name: traefik_default
    external: true
  observability:
    name: observability
    external: true
  backing:
    name: backing
    external: true
  data:
    name: data
    external: true
