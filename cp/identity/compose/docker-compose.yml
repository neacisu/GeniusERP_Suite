version: '3.8'

services:
  identity:
    build:
      context: ../../..
      dockerfile: cp/identity/Dockerfile
    container_name: genius-suite-identity
    env_file:
      - ../.cp.identity.env
    environment:
      - CP_IDT_APP_PORT=${CP_IDT_APP_PORT}
      - CP_IDT_APP_METRICS_PORT=${CP_IDT_APP_METRICS_PORT}
      - CP_IDT_APP_NODE_ENV=${CP_IDT_APP_NODE_ENV}
      - CP_IDT_OBS_SERVICE_NAME=${CP_IDT_OBS_SERVICE_NAME}
      - SUITE_OBS_OTEL_COLLECTOR_GRPC_URL=${SUITE_OBS_OTEL_COLLECTOR_GRPC_URL:-http://otel-collector:4317}
      - LOG_LEVEL=info
    networks:
      - traefik_default
      - observability
      - backing
      - data
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_default
      - traefik.http.routers.identity.rule=Host(`identity.geniuserp.app`)
      - traefik.http.routers.identity.entrypoints=websecure
      - traefik.http.routers.identity.tls.certresolver=cloudflare
      - traefik.http.routers.identity.middlewares=security-headers@file
      - traefik.http.services.identity.loadbalancer.server.port=6250
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6250/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


networks:
  traefik_default:
    name: traefik_default
    external: true
  observability:
    name: observability
    external: true
  backing:
    name: backing
    external: true
  data:
    name: data
    external: true
