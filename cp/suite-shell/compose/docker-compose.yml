version: '3.8'

services:
  suite-shell:
    build:
      context: ../../..
      dockerfile: cp/suite-shell/Dockerfile
    container_name: genius-suite-shell
    env_file:
      - ../.cp.suite-shell.env
    environment:
      - CP_SHELL_APP_PORT=${CP_SHELL_APP_PORT}
      - CP_SHELL_APP_METRICS_PORT=${CP_SHELL_APP_METRICS_PORT}
      - CP_SHELL_APP_NODE_ENV=${CP_SHELL_APP_NODE_ENV}
      - CP_SHELL_OBS_SERVICE_NAME=${CP_SHELL_OBS_SERVICE_NAME}
      - SUITE_OBS_OTEL_COLLECTOR_GRPC_URL=${SUITE_OBS_OTEL_COLLECTOR_GRPC_URL:-http://otel-collector:4317}
      - LOG_LEVEL=info
    networks:
      - traefik_default
      - observability
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_default
      - traefik.http.routers.suite-shell.rule=Host(`shell.geniuserp.app`)
      - traefik.http.routers.suite-shell.entrypoints=websecure
      - traefik.http.routers.suite-shell.tls.certresolver=cloudflare
      - traefik.http.routers.suite-shell.middlewares=security-headers@file
      - traefik.http.services.suite-shell.loadbalancer.server.port=6100
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6100/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


networks:
  traefik_default:
    name: traefik_default
    external: true
  observability:
    name: observability
    external: true
  backing:
    name: backing
    external: true
  data:
    name: data
    external: true