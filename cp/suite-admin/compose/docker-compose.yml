version: '3.8'

services:
  suite-admin:
    build:
      context: ../../..
      dockerfile: cp/suite-admin/Dockerfile
    container_name: genius-suite-admin
    extra_hosts:
      - "postgres:10.10.0.3"
    env_file:
      - ../.cp.suite-admin.env
    environment:
      - CP_ADMIN_APP_PORT=${CP_ADMIN_APP_PORT}
      - CP_ADMIN_APP_METRICS_PORT=${CP_ADMIN_APP_METRICS_PORT}
      - CP_ADMIN_APP_NODE_ENV=${CP_ADMIN_APP_NODE_ENV}
      - CP_ADMIN_OBS_SERVICE_NAME=${CP_ADMIN_OBS_SERVICE_NAME}
      - SUITE_OBS_OTEL_COLLECTOR_GRPC_URL=${SUITE_OBS_OTEL_COLLECTOR_GRPC_URL:-http://otel-collector:4317}
      - LOG_LEVEL=info
    networks:
      - traefik_default
      - observability
      - data
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_default
      - traefik.http.routers.suite-admin.rule=Host(`admin.geniuserp.app`)
      - traefik.http.routers.suite-admin.entrypoints=websecure
      - traefik.http.routers.suite-admin.tls.certresolver=cloudflare
      - traefik.http.routers.suite-admin.middlewares=security-headers@file
      - traefik.http.services.suite-admin.loadbalancer.server.port=6150
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6150/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


networks:
  traefik_default:
    name: traefik_default
    external: true
  observability:
    name: observability
    external: true
  backing:
    name: backing
    external: true
  data:
    name: data
    external: true
