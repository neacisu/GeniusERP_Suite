version: '3.8'

services:
  analytics-hub:
    build:
      context: ../../../
      dockerfile: cp/analytics-hub/Dockerfile
    container_name: genius-suite-analytics-hub
    env_file:
      - ../.cp.analytics-hub.env
    environment:
      - CP_ANLY_APP_PORT=${CP_ANLY_APP_PORT}
      - CP_ANLY_APP_METRICS_PORT=${CP_ANLY_APP_METRICS_PORT}
      - CP_ANLY_APP_NODE_ENV=${CP_ANLY_APP_NODE_ENV}
      - CP_ANLY_OBS_SERVICE_NAME=${CP_ANLY_OBS_SERVICE_NAME}
      - SUITE_OBS_OTEL_COLLECTOR_GRPC_URL=${SUITE_OBS_OTEL_COLLECTOR_GRPC_URL:-http://otel-collector:4317}
      - LOG_LEVEL=info
    networks:
      - traefik_default
      - observability
      - backing
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_default
      - traefik.http.routers.analytics-hub.rule=Host(`analytics.geniuserp.app`)
      - traefik.http.routers.analytics-hub.entrypoints=websecure
      - traefik.http.routers.analytics-hub.tls.certresolver=cloudflare
      - traefik.http.routers.analytics-hub.middlewares=security-headers@file
      - traefik.http.services.analytics-hub.loadbalancer.server.port=6350
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${CP_ANLY_APP_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


networks:
  traefik_default:
    name: traefik_default
    external: true
  observability:
    name: observability
    external: true
  backing:
    name: backing
    external: true
  data:
    name: data
    external: true