version: '3.8'

services:
  ai-hub:
    build:
      context: ../../../
      dockerfile: cp/ai-hub/Dockerfile
    container_name: genius-suite-ai-hub
    env_file:
      - ../.cp.ai-hub.env
    environment:
      - CP_AI_APP_PORT=${CP_AI_APP_PORT}
      - CP_AI_APP_METRICS_PORT=${CP_AI_APP_METRICS_PORT}
      - CP_AI_APP_NODE_ENV=${CP_AI_APP_NODE_ENV}
      - CP_AI_OBS_SERVICE_NAME=${CP_AI_OBS_SERVICE_NAME}
      - SUITE_OBS_OTEL_COLLECTOR_GRPC_URL=${SUITE_OBS_OTEL_COLLECTOR_GRPC_URL:-http://otel-collector:4317}
      - LOG_LEVEL=info
    networks:
      - traefik_default
      - observability
      - backing
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_default
      - traefik.http.routers.ai-hub.rule=Host(`ai.geniuserp.app`)
      - traefik.http.routers.ai-hub.entrypoints=websecure
      - traefik.http.routers.ai-hub.tls.certresolver=cloudflare
      - traefik.http.routers.ai-hub.middlewares=security-headers@file
      - traefik.http.services.ai-hub.loadbalancer.server.port=6400
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${CP_AI_APP_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


networks:
  traefik_default:
    name: traefik_default
    external: true
  observability:
    name: observability
    external: true
  backing:
    name: backing
    external: true
  data:
    name: data
    external: true