version: '3.8'

services:
  suite-login:
    build:
      context: ../../../
      dockerfile: cp/suite-login/Dockerfile
    container_name: genius-suite-login
    env_file:
      - ../.cp.suite-login.env
    environment:
      - CP_LOGIN_APP_PORT=${CP_LOGIN_APP_PORT}
      - CP_LOGIN_APP_METRICS_PORT=${CP_LOGIN_APP_METRICS_PORT}
      - CP_LOGIN_APP_NODE_ENV=${CP_LOGIN_APP_NODE_ENV}
      - CP_LOGIN_OBS_SERVICE_NAME=${CP_LOGIN_OBS_SERVICE_NAME}
      - SUITE_OBS_OTEL_COLLECTOR_GRPC_URL=${SUITE_OBS_OTEL_COLLECTOR_GRPC_URL:-http://otel-collector:4317}
      - LOG_LEVEL=info
    networks:
      - traefik_default
      - observability
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_default
      - traefik.http.routers.suite-login.rule=Host(`login.geniuserp.app`)
      - traefik.http.routers.suite-login.entrypoints=websecure
      - traefik.http.routers.suite-login.tls.certresolver=cloudflare
      - traefik.http.routers.suite-login.middlewares=security-headers@file
      - traefik.http.services.suite-login.loadbalancer.server.port=6200
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6200/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


networks:
  traefik_default:
    name: traefik_default
    external: true
  observability:
    name: observability
    external: true
  backing:
    name: backing
    external: true
  data:
    name: data
    external: true
