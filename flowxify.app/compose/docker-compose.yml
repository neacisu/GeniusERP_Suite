version: '3.9'

services:
  flowxify-app:
    build:
      context: ../..
      dockerfile: flowxify.app/Dockerfile
    container_name: flowxify-app
    extra_hosts:
      - "postgres:10.10.0.3"
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_default
      - traefik.http.routers.flowxify-app.rule=Host(`flowxify.geniuserp.app`)
      - traefik.http.routers.flowxify-app.entrypoints=websecure
      - traefik.http.routers.flowxify-app.tls.certresolver=cloudflare
      - traefik.http.routers.flowxify-app.middlewares=security-headers@file
      - traefik.http.services.flowxify-app.loadbalancer.server.port=6600
    restart: unless-stopped
    env_file:
      - ../../.suite.general.env
      - ../.flowxify.env
    environment:
      NODE_ENV: ${FLOWX_APP_NODE_ENV:-production}
      PORT: ${FLOWX_APP_PORT:-6600}
      OTEL_EXPORTER_OTLP_ENDPOINT: "${SUITE_OBS_OTEL_COLLECTOR_HTTP_URL:-http://otel-collector:4318}/v1/traces"
      OTEL_SERVICE_NAME: flowxify.app
    networks:
      - traefik_default
      - observability
      - backing
      - data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${FLOWX_APP_PORT:-6600}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


networks:
  traefik_default:
    name: traefik_default
    external: true
  observability:
    name: observability
    external: true
  backing:
    name: backing
    external: true
  data:
    name: data
    external: true
