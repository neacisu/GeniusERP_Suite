version: '3.9'

services:
  triggerra-app:
    build:
      context: ../..
      dockerfile: triggerra.app/Dockerfile
    container_name: triggerra-app
    env_file:
      - ../../.suite.general.env
      - ../.triggerra.env
    environment:
      NODE_ENV: ${TRIGR_APP_NODE_ENV:-production}
      PORT: ${TRIGR_APP_PORT:-6800}
      OTEL_EXPORTER_OTLP_ENDPOINT: "${SUITE_OBS_OTEL_COLLECTOR_HTTP_URL:-http://otel-collector:4318}/v1/traces"
      OTEL_SERVICE_NAME: triggerra.app
    networks:
      - traefik_default
      - observability
      - backing
      - data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${TRIGR_APP_PORT:-6800}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_default
      - traefik.http.routers.triggerra-app.rule=Host(`triggerra.geniuserp.app`)
      - traefik.http.routers.triggerra-app.entrypoints=websecure
      - traefik.http.routers.triggerra-app.tls.certresolver=cloudflare
      - traefik.http.routers.triggerra-app.middlewares=security-headers@file
      - traefik.http.services.triggerra-app.loadbalancer.server.port=6800
    restart: unless-stopped


networks:
  traefik_default:
    name: traefik_default
    external: true
  observability:
    name: observability
    external: true
  backing:
    name: backing
    external: true
  data:
    name: data
    external: true
