services:
  traefik:
    image: traefik:v3.7.12
    container_name: geniuserp-traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../.proxy.env
      - ../../../.suite.general.env
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
      - "${PROXY_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - gs_traefik_certs:/letsencrypt
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=geniuserp_net_suite_internal
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --metrics.prometheus=true
      - --metrics.prometheus.entryPoint=metrics
      - --entrypoints.metrics.address=:9100
      - --log.level=INFO
      - --accesslog=${PROXY_OBS_ACCESS_LOG_ENABLED:-true}
    networks:
      - net_edge
      - net_suite_internal
      - net_observability
    labels:
      - traefik.enable=false

networks:
  net_edge:
    external: true
    name: geniuserp_net_edge
  net_suite_internal:
    external: true
    name: geniuserp_net_suite_internal
  net_observability:
    external: true
    name: geniuserp_net_observability

volumes:
  gs_traefik_certs:
    name: geniuserp_traefik_certs
    driver: local
