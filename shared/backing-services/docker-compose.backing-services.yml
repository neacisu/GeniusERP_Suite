# ============================================================================
# GeniusSuite - Backing Services (sursă unică)
# Verificat 28.08.2026. Fișierul legacy din rădăcină a fost eliminat (split-brain).
# ============================================================================

services:
  postgres_server:
    image: postgres:18.6
    container_name: geniuserp-postgres
    env_file:
      - ../../.suite.general.env
      - ../../.backing-services.env
    environment:
      POSTGRES_USER: suite_admin
      POSTGRES_PASSWORD: ${SUITE_DB_POSTGRES_PASS:-ChangeThisPostgresPassword}
      POSTGRES_DB: postgres
      POSTGRES_MULTIPLE_DATABASES: identity_db,licensing_db,temporal_db,temporal_visibility,archify_db,cerniq_db,flowxify_db,iwms_db,mercantiq_db,numeriqo_db,triggerra_db,vettify_db,geniuserp_db,admin_db
    volumes:
      - ../../scripts/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/10-multi-db.sh:ro
      - gs_pgdata_identity:/var/lib/postgresql/data/identity
      - gs_pgdata_licensing:/var/lib/postgresql/data/licensing
      - gs_pgdata_temporal:/var/lib/postgresql/data/temporal
      - gs_pgdata_archify:/var/lib/postgresql/data/archify
      - gs_pgdata_cerniq:/var/lib/postgresql/data/cerniq
      - gs_pgdata_flowxify:/var/lib/postgresql/data/flowxify
      - gs_pgdata_iwms:/var/lib/postgresql/data/iwms
      - gs_pgdata_mercantiq:/var/lib/postgresql/data/mercantiq
      - gs_pgdata_numeriqo:/var/lib/postgresql/data/numeriqo
      - gs_pgdata_triggerra:/var/lib/postgresql/data/triggerra
      - gs_pgdata_vettify:/var/lib/postgresql/data/vettify
      - gs_pgdata_geniuserp:/var/lib/postgresql/data/geniuserp
      - gs_pgdata_admin:/var/lib/postgresql/data/admin
    networks:
      - net_backing_services
      - net_observability
    ports:
      - "${SUITE_DB_POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suite_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kafka:
    image: apache/kafka:4.3.1
    container_name: geniuserp-kafka
    env_file:
      - ../../.suite.general.env
      - ../../.backing-services.env
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - gs_kafka_data:/var/lib/kafka/data
    networks:
      - net_backing_services
      - net_observability
    ports:
      - "9092:9092"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Pin verificat 28.08.2026:
  # - temporalio/auto-setup:latest = deprecated + nereproductibil
  # - temporalio/auto-setup:1.31.2 = 404 pe Docker Hub
  # - temporalio/server:1.32.0 = 404; GitHub nu are release stabil v1.32.x
  # - ultimul server GA: v1.31.2 (2026-07-08) → temporalio/server:1.31.2
  temporal-schema:
    image: temporalio/admin-tools:1.31.2
    container_name: geniuserp-temporal-schema
    env_file:
      - ../../.suite.general.env
      - ../../.backing-services.env
    environment:
      SQL_PLUGIN: postgres12
      SQL_HOST: postgres_server
      SQL_PORT: 5432
      SQL_USER: suite_admin
      SQL_PASSWORD: ${SUITE_DB_POSTGRES_PASS:-ChangeThisPostgresPassword}
      SQL_DATABASE: temporal_db
    networks:
      - net_backing_services
    depends_on:
      postgres_server:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        # Core (temporal_db)
        SQL_DATABASE=temporal_db temporal-sql-tool setup-schema -v 0.0 || true
        SQL_DATABASE=temporal_db temporal-sql-tool update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned
        # Visibility — obligatoriu pentru temporalio/server:1.31.2 (auto-setup o făcea implicit)
        SQL_DATABASE=temporal_visibility temporal-sql-tool setup-schema -v 0.0 || true
        SQL_DATABASE=temporal_visibility temporal-sql-tool update-schema -d /etc/temporal/schema/postgresql/v12/visibility/versioned

  temporal:
    image: temporalio/server:1.31.2
    container_name: geniuserp-temporal
    env_file:
      - ../../.suite.general.env
      - ../../.backing-services.env
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=suite_admin
      - POSTGRES_PWD=${SUITE_DB_POSTGRES_PASS:-ChangeThisPostgresPassword}
      - POSTGRES_SEEDS=postgres_server
      - DBNAME=temporal_db
      - VISIBILITY_DBNAME=temporal_visibility
      - BIND_ON_IP=0.0.0.0
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig/docker.yaml
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    networks:
      - net_backing_services
      - net_observability
    ports:
      - "7233:7233"
    depends_on:
      postgres_server:
        condition: service_healthy
      temporal-schema:
        condition: service_completed_successfully
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.53.3
    container_name: geniuserp-temporal-ui
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    networks:
      - net_backing_services
      - net_observability
    ports:
      - "8233:8080"
    depends_on:
      - temporal
    restart: unless-stopped

  # SuperTokens 12.1.1 — MAJOR față de 11.2.
  # Volum existent: backup identity_db + SCHEMA-REWORK.md înainte de primul up.
  # Volum curat (dev/CI): schema la start. Vezi shared/backing-services/README.md.
  supertokens-core:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:12.1.1
    container_name: geniuserp-supertokens
    env_file:
      - ../../.suite.general.env
      - ../../.backing-services.env
    environment:
      POSTGRESQL_HOST: postgres_server
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USER: suite_admin
      POSTGRESQL_PASSWORD: ${SUITE_DB_POSTGRES_PASS:-ChangeThisPostgresPassword}
      POSTGRESQL_DATABASE_NAME: identity_db
      POSTGRESQL_TABLE_NAMES_PREFIX: supertokens_
      API_KEYS: ${CP_IDT_AUTH_SUPERTOKENS_API_KEY:-ChangeThisSuperTokensKey}
    networks:
      - net_backing_services
    ports:
      - "3567:3567"
    depends_on:
      postgres_server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3567/hello"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # OpenBao 2.6.2 — pin imagine. Namespace Sealing per tenant (v2.6) se activează
  # după init, pe namespace-uri; nu e pornit aici în -dev (nu e pentru producție).
  openbao:
    image: openbao/openbao:2.6.2
    container_name: geniuserp-openbao
    cap_add:
      - IPC_LOCK
    command: ["server", "-config=/openbao/config/openbao.hcl"]
    volumes:
      - ./openbao.hcl:/openbao/config/openbao.hcl:ro
      - gs_openbao_data:/openbao/file
    networks:
      - net_backing_services
    ports:
      - "8200:8200"
    restart: unless-stopped

networks:
  net_edge:
    external: true
    name: geniuserp_net_edge
  net_suite_internal:
    external: true
    name: geniuserp_net_suite_internal
  net_backing_services:
    external: true
    name: geniuserp_net_backing_services
  net_observability:
    external: true
    name: geniuserp_net_observability

volumes:
  gs_pgdata_identity:
    name: geniuserp_pgdata_identity
    driver: local
  gs_pgdata_licensing:
    name: geniuserp_pgdata_licensing
    driver: local
  gs_pgdata_temporal:
    name: geniuserp_pgdata_temporal
    driver: local
  gs_pgdata_archify:
    name: geniuserp_pgdata_archify
    driver: local
  gs_pgdata_cerniq:
    name: geniuserp_pgdata_cerniq
    driver: local
  gs_pgdata_flowxify:
    name: geniuserp_pgdata_flowxify
    driver: local
  gs_pgdata_iwms:
    name: geniuserp_pgdata_iwms
    driver: local
  gs_pgdata_mercantiq:
    name: geniuserp_pgdata_mercantiq
    driver: local
  gs_pgdata_numeriqo:
    name: geniuserp_pgdata_numeriqo
    driver: local
  gs_pgdata_triggerra:
    name: geniuserp_pgdata_triggerra
    driver: local
  gs_pgdata_vettify:
    name: geniuserp_pgdata_vettify
    driver: local
  gs_pgdata_geniuserp:
    name: geniuserp_pgdata_geniuserp
    driver: local
  gs_pgdata_admin:
    name: geniuserp_pgdata_admin
    driver: local
  gs_kafka_data:
    name: geniuserp_kafka_data
    driver: local
  gs_openbao_data:
    name: geniuserp_openbao_data
    driver: local
  geniuserp_loki_data:
    name: geniuserp_loki_data
    driver: local
