version: '3.9'

services:
  i-wms-app:
    build:
      context: ../..
      dockerfile: i-wms.app/Dockerfile
    container_name: i-wms-app
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_default
      - traefik.http.routers.i-wms-app.rule=Host(`iwms.geniuserp.app`)
      - traefik.http.routers.i-wms-app.entrypoints=websecure
      - traefik.http.routers.i-wms-app.tls.certresolver=cloudflare
      - traefik.http.routers.i-wms-app.middlewares=security-headers@file
      - traefik.http.services.i-wms-app.loadbalancer.server.port=6650
    restart: unless-stopped
    env_file:
      - ../../.suite.general.env
      - ../.i-wms.env
    environment:
      NODE_ENV: ${IWMS_APP_NODE_ENV:-production}
      PORT: ${IWMS_APP_PORT:-6650}
      OTEL_EXPORTER_OTLP_ENDPOINT: "${SUITE_OBS_OTEL_COLLECTOR_HTTP_URL:-http://otel-collector:4318}/v1/traces"
      OTEL_SERVICE_NAME: i-wms.app
    networks:
      - traefik_default
      - observability
      - backing
      - data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${IWMS_APP_PORT:-6650}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


networks:
  traefik_default:
    name: traefik_default
    external: true
  observability:
    name: observability
    external: true
  backing:
    name: backing
    external: true
  data:
    name: data
    external: true
