version: '3.9'

services:
  mercantiq-app:
    build:
      context: ../..
      dockerfile: mercantiq.app/Dockerfile
    container_name: mercantiq-app
    extra_hosts:
      - "postgres:10.10.0.3"
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_default
      - traefik.http.routers.mercantiq-app.rule=Host(`mercantiq.geniuserp.app`)
      - traefik.http.routers.mercantiq-app.entrypoints=websecure
      - traefik.http.routers.mercantiq-app.tls.certresolver=cloudflare
      - traefik.http.routers.mercantiq-app.middlewares=security-headers@file
      - traefik.http.services.mercantiq-app.loadbalancer.server.port=6700
    restart: unless-stopped
    env_file:
      - ../../.suite.general.env
      - ../.mercantiq.env
    environment:
      NODE_ENV: ${MERCQ_APP_NODE_ENV:-production}
      PORT: ${MERCQ_APP_PORT:-6700}
      OTEL_EXPORTER_OTLP_ENDPOINT: "${SUITE_OBS_OTEL_COLLECTOR_HTTP_URL:-http://otel-collector:4318}/v1/traces"
      OTEL_SERVICE_NAME: mercantiq.app
    networks:
      - traefik_default
      - observability
      - backing
      - data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MERCQ_APP_PORT:-6700}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


networks:
  traefik_default:
    name: traefik_default
    external: true
  observability:
    name: observability
    external: true
  backing:
    name: backing
    external: true
  data:
    name: data
    external: true
